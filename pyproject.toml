[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "powerbin_rs"
version = "0.1.0"
description = "Fast, highly-optimised Rust implementation of the PowerBin adaptive data binning algorithm"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Antigravity Team" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.20",
]

[project.urls]
Homepage = "https://github.com/flol3622/powerbin_rs"
Repository = "https://github.com/flol3622/powerbin_rs"

[project.optional-dependencies]
plot = [
    "matplotlib>=3.5",
    "plotbin>=1.0",
]
test = [
    "pytest>=7.0",
]

[tool.maturin]
python-source = "python"
module-name = "powerbin_rs._core"
python-packages = ["powerbin_rs", "powerbin"]
features = ["python"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.16.6",
    "ty>=0.0.79",
]
