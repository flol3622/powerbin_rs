[package]
name = "powerbin_rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "powerbin_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
delaunator = "1.1.0"
rayon = "1.12.0"
kiddo = { version = "6.3.0", features = ["simd", "multi-threaded"] }
pyo3 = { version = "0.29.2", optional = true, features = ["extension-module"] }
numpy = { version = "0.29.0", optional = true }

[features]
default = []
python = ["dep:pyo3", "dep:numpy"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
